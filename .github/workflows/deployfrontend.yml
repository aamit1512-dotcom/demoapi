
name: Deploy Weather Frontend to IIS

on:
  push:
    branches:
      - main
      - feature/weather-frontend
    paths:
      - 'frontend/**'
      - '.github/workflows/deployfrontend.yml'

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-frontend-pr:
    name: Create or Update Frontend PR
    if: github.ref == 'refs/heads/feature/weather-frontend'
    runs-on: ubuntu-latest

    steps:
      - name: Create or update frontend PR
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const head = `${owner}:feature/weather-frontend`;
            const base = "main";

            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              head,
              base,
              state: "open"
            });

            if (pulls.length > 0) {
              core.info(`Frontend PR already exists: #${pulls[0].number}`);
            } else {
              const { data: pr } = await github.rest.pulls.create({
                owner,
                repo,
                title: "Deploy Weather Frontend",
                head: "feature/weather-frontend",
                base,
                body: "Automated pull request for frontend changes."
              });

              core.info(`Created frontend PR #${pr.number}`);
            }

  deploy-frontend:
    name: Deploy Frontend to IIS
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate frontend files
        shell: powershell
        run: |
          $sourcePath = "$env:GITHUB_WORKSPACE\frontend"

          foreach ($file in @("index.html", "app.js", "style.css")) {
              $filePath = Join-Path $sourcePath $file

              if (!(Test-Path $filePath)) {
                  throw "Required frontend file not found: frontend/$file"
              }
          }

          Write-Host "Frontend validation passed."

      - name: Deploy frontend to IIS
        shell: powershell
        run: |
          $sourcePath = "$env:GITHUB_WORKSPACE\frontend"
          $destinationPath = "C:\inetpub\wwwroot\weatherapp-frontend"

          if (!(Test-Path $destinationPath)) {
              throw "IIS destination folder does not exist: $destinationPath"
          }

          # Copy frontend files without deleting existing destination files.
          # Do not stop or restart the API application pool.
          Copy-Item -Path "$sourcePath\*" `
              -Destination $destinationPath `
              -Recurse -Force -ErrorAction Stop

          Write-Host "Frontend files copied successfully."

      - name: Verify frontend response
        shell: powershell
        run: |
          $url = "http://localhost:91/"
          $maxAttempts = 6

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              try {
                  $response = Invoke-WebRequest `
                      -Uri $url `
                      -UseBasicParsing `
                      -TimeoutSec 15

                  if ($response.StatusCode -eq 200) {
                      Write-Host "Frontend health check passed."
                      Write-Host "HTTP Status: $($response.StatusCode)"
                      exit 0
                  }

                  Write-Warning "Attempt ${attempt}: HTTP status $($response.StatusCode)"
              }
              catch {
                  Write-Warning "Attempt ${attempt} failed: $($_.Exception.Message)"
              }

              if ($attempt -lt $maxAttempts) {
                  Start-Sleep -Seconds 5
              }
          }

          throw "Frontend health check failed at $url"