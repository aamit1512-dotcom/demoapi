name: Demoapi deployed on IIS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        shell: powershell
        run: dotnet restore

      - name: Build project
        shell: powershell
        run: dotnet build --configuration Release --no-restore

      - name: Publish project
        shell: powershell
        run: dotnet publish --configuration Release --no-build --output "$env:GITHUB_WORKSPACE\publish"

      - name: Deploy to IIS
        shell: powershell
        run: |
          Import-Module WebAdministration

          $publishPath = "$env:GITHUB_WORKSPACE\publish"
          $iisSiteName = "weatherapp"
          $iisAppPoolName = "weatherapp"
          $iisPath = "C:\inetpub\wwwroot\DemoApi\publish"

          # Validate paths
          if (!(Test-Path $publishPath)) {
              throw "Publish folder not found: $publishPath"
          }

          if (!(Test-Path "$publishPath\web.config")) {
              throw "Published web.config not found."
          }

          if (!(Test-Path $iisPath)) {
              throw "IIS destination folder does not exist: $iisPath"
          }

          # Stop IIS site and application pool
          Stop-WebSite -Name $iisSiteName
          Stop-WebAppPool -Name $iisAppPoolName

          try {
              # Remove existing deployment files
              Get-ChildItem -Path $iisPath -Force |
                  Remove-Item -Recurse -Force

              # Copy published files
              Copy-Item -Path "$publishPath\*" `
                  -Destination $iisPath `
                  -Recurse -Force

              Write-Host "Deployment completed successfully."
          }
          finally {
              # Start IIS application pool and site
              $maxAttempts = 5
              $started = $false

              # Wait until IIS can start the application pool
              for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
                try {
                  $poolState = (Get-WebAppPoolState -Name $iisAppPoolName).Value

                  if ($poolState -eq "Started") {
                    Write-Host "Application pool is already started."
                    $started = $true
                    break
                  }

                  if ($poolState -eq "Stopped") {
                    Start-WebAppPool -Name $iisAppPoolName
                  }

                  Start-Sleep -Seconds 3
                  $poolState = (Get-WebAppPoolState -Name $iisAppPoolName).Value

                  if ($poolState -eq "Started") {
                    $started = $true
                    break
                  }

                  Write-Host "Attempt $attempt: pool state is $poolState"
                }
                catch {
                  Write-Warning "Attempt $attempt failed: $($_.Exception.Message)"
                }

                Start-Sleep -Seconds 5
              }

              if (-not $started) {
                throw "Application pool '$iisAppPoolName' did not start after $maxAttempts attempts."
              }

              # Start the website only after the pool is ready
              $siteState = (Get-Website -Name $iisSiteName).State
              if ($siteState -ne "Started") {
                Start-Website -Name $iisSiteName
              }

              Write-Host "IIS application pool and website are running."
          }
