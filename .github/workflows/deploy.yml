name: Demoapi deployed on IIS

on:
  push:
    branches:
      - main
      - feature/weather-api-update
    paths-ignore:
      - 'frontend/**'
      - '.github/workflows/deployfrontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-api-pr:
    if: github.ref == 'refs/heads/feature/weather-api-update'
    runs-on: self-hosted

    steps:
      - name: Create or check API PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = "feature/weather-api-update";
            const base = "main";

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${head}`,
              base,
              state: "open"
            });

            if (existing.data.length > 0) {
              core.info(`API PR already exists: #${existing.data[0].number}`);
              return;
            }

            const result = await github.rest.pulls.create({
              owner,
              repo,
              title: "API: Update weather API",
              head,
              base,
              body: [
                "## API changes",
                "",
                "Review the API changes before merging into main.",
                "The API deployment workflow runs after changes are merged."
              ].join("\n")
            });

            core.info(`Created API PR: ${result.data.html_url}`);

  deploy-api:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        shell: powershell
        run: dotnet restore

      - name: Build project
        shell: powershell
        run: dotnet build --configuration Release --no-restore

      - name: Publish project
        shell: powershell
        run: dotnet publish --configuration Release --no-build --output "$env:GITHUB_WORKSPACE\publish"

      - name: Deploy to IIS
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $publishPath = "$env:GITHUB_WORKSPACE\publish"
          $iisPath = "C:\inetpub\wwwroot\DemoApi\publish"
          $offlineFile = Join-Path $iisPath "app_offline.htm"

          if (!(Test-Path $publishPath)) {
              throw "Published output not found: $publishPath"
          }

          if (!(Test-Path $iisPath)) {
              throw "IIS destination folder does not exist: $iisPath"
          }

          if (!(Test-Path "$iisPath\web.config")) {
              throw "IIS web.config not found: $iisPath"
          }

          # FIX: $iisAppPoolName and $iisSiteName were never defined.
          # Find them automatically from the IIS site/application whose folder is $iisPath.
          Import-Module WebAdministration

          function Get-FullIisPath($p) {
              [System.IO.Path]::GetFullPath([Environment]::ExpandEnvironmentVariables($p)).TrimEnd('\')
          }

          $targetPath = Get-FullIisPath $iisPath
          $iisSiteName = $null
          $iisAppPoolName = $null

          # 1) A site whose root folder is the deploy folder
          foreach ($site in Get-Website) {
              if ((Get-FullIisPath $site.PhysicalPath) -ieq $targetPath) {
                  $iisSiteName = $site.Name
                  $iisAppPoolName = $site.ApplicationPool
                  break
              }
          }

          # 2) Otherwise, an application (virtual directory app) under some site
          if (-not $iisAppPoolName) {
              foreach ($app in Get-WebApplication) {
                  if ((Get-FullIisPath $app.PhysicalPath) -ieq $targetPath) {
                      if ($app.ItemXPath -match "site\[@name='([^']+)'") {
                          $iisSiteName = $Matches[1]
                      }
                      $iisAppPoolName = $app.applicationPool
                      break
                  }
              }
          }

          if ([string]::IsNullOrWhiteSpace($iisAppPoolName) -or [string]::IsNullOrWhiteSpace($iisSiteName)) {
              Write-Host "Sites found on this server:"
              Get-Website | ForEach-Object { Write-Host (" - {0} | pool: {1} | path: {2}" -f $_.Name, $_.ApplicationPool, $_.PhysicalPath) }
              throw "No IIS site/application points to '$iisPath'. Check the path above against the sites listed."
          }

          Write-Host "Using IIS site '$iisSiteName' with application pool '$iisAppPoolName'."

          try {
              Set-Content -Path $offlineFile -Value "Application is updating. Please try again shortly." -Encoding UTF8
              Start-Sleep -Seconds 10
              & robocopy $publishPath $iisPath /MIR /XF appsettings.json web.config app_offline.htm /R:3 /W:5
              $robocopyExitCode = $LASTEXITCODE

              if ($robocopyExitCode -ge 8) {
                  throw "Robocopy deployment failed with exit code $robocopyExitCode."
              }

              # FIX: robocopy exit codes 1-7 mean success, but GitHub's PowerShell wrapper
              # ends the step with the last $LASTEXITCODE, so a code like 3 fails the step.
              # Reset it now that we have checked it ourselves.
              $global:LASTEXITCODE = 0

              Write-Host "API files mirrored successfully (robocopy exit code $robocopyExitCode)."
          }
          finally {
              # Start IIS application pool and site
              $maxAttempts = 5
              $started = $false

              # Wait until IIS can start the application pool
              for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
                try {
                  $poolState = (Get-WebAppPoolState -Name $iisAppPoolName).Value

                  if ($poolState -eq "Started") {
                    Write-Host "Application pool is already started."
                    $started = $true
                    break
                  }

                  if ($poolState -eq "Stopped") {
                    Start-WebAppPool -Name $iisAppPoolName
                  }

                  Start-Sleep -Seconds 3
                  $poolState = (Get-WebAppPoolState -Name $iisAppPoolName).Value

                  if ($poolState -eq "Started") {
                    $started = $true
                    break
                  }

                  Write-Host "Attempt ${attempt}: pool state is $poolState"
                }
                catch {
                  Write-Warning "Attempt ${attempt} failed: $($_.Exception.Message)"
                }

                Start-Sleep -Seconds 5
              }

              if (-not $started) {
                throw "Application pool '$iisAppPoolName' did not start after $maxAttempts attempts."
              }

              # Start the website only after the pool is ready
              $siteState = (Get-Website -Name $iisSiteName).State
              if ($siteState -ne "Started") {
                Start-Website -Name $iisSiteName
              }

              Write-Host "IIS application pool and website are running."
              Remove-Item -Path $offlineFile -Force -ErrorAction SilentlyContinue
          }

      - name: Verify API response
        shell: powershell
        run: |
          $url = "http://localhost:90/api/weatherforecast?city=Delhi&days=5"

          for ($attempt = 1; $attempt -le 6; $attempt++) {
              try {
                  $response = Invoke-RestMethod -Uri $url -TimeoutSec 15
                  Write-Host "API health check passed."
                  $response | ConvertTo-Json -Depth 10
                  exit 0
              }
              catch {
                  Write-Warning "API check attempt $attempt failed: $($_.Exception.Message)"

                  if ($attempt -lt 6) {
                      Start-Sleep -Seconds 5
                  }
              }
          }

          throw "API health check failed at $url"
          exit 0